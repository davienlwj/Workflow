<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Workflow</title>
<meta name="description" content="A minimal calendar. Type or dictate one line, it files itself.">

<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

<!-- Add to Home Screen on iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Workflow">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">

<link rel="stylesheet" href="./css/style.css">
</head>
<body>

<header class="bar">
  <button id="prev" class="ghost" aria-label="Previous month">&#8249;</button>
  <button id="title" class="month" aria-live="polite">Month</button>
  <button id="next" class="ghost" aria-label="Next month">&#8250;</button>
  <button id="settingsBtn" class="ghost dots" aria-label="Settings">&#183;&#183;&#183;</button>
</header>

<main>
  <div id="weekdays" class="weekdays" aria-hidden="true"></div>
  <div id="grid" class="grid" role="grid" aria-label="Calendar"></div>

  <section class="day">
    <h2 id="dayTitle">Today</h2>
    <ul id="list" class="list"></ul>
    <p id="empty" class="empty">Nothing yet.</p>
  </section>
</main>

<form id="composer" class="composer" autocomplete="off">
  <input id="input" type="text" placeholder="Meeting with Tom at KLCC at 3pm on 12/8"
         enterkeyhint="done" autocapitalize="sentences" autocorrect="on" spellcheck="false">
  <button type="button" id="mic" class="mic" aria-label="Dictate" hidden>
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3z"/>
      <path d="M5 11a7 7 0 0 0 14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round"/>
    </svg>
  </button>
  <button type="submit" id="send" class="send" aria-label="Add">&#8593;</button>
</form>

<!-- Review sheet: what the parser understood, editable before saving -->
<div id="scrim" class="scrim" hidden></div>
<section id="sheet" class="sheet" hidden aria-modal="true" role="dialog" aria-label="Task details">
  <div class="grabber"></div>
  <form id="sheetForm">
    <label class="field">
      <span>Subject</span>
      <input id="fTitle" type="text" required>
    </label>
    <div class="row">
      <label class="field">
        <span>Date</span>
        <input id="fDate" type="date">
      </label>
      <label class="field">
        <span>Time</span>
        <input id="fTime" type="time">
      </label>
    </div>
    <label class="field">
      <span>Location</span>
      <input id="fLocation" type="text" placeholder="&mdash;">
    </label>
    <p id="fRaw" class="raw"></p>
    <div class="actions">
      <button type="button" id="fDelete" class="danger" hidden>Delete</button>
      <button type="button" id="fCancel" class="ghost-btn">Cancel</button>
      <button type="submit" id="fSave" class="primary">Add</button>
    </div>
  </form>
</section>

<!-- Settings sheet -->
<section id="settingsSheet" class="sheet" hidden aria-modal="true" role="dialog" aria-label="Settings">
  <div class="grabber"></div>
  <label class="toggle">
    <span>Read 12/8 as 12 August</span>
    <input id="sDayFirst" type="checkbox">
  </label>
  <label class="toggle">
    <span>24-hour time</span>
    <input id="sUse24" type="checkbox">
  </label>
  <label class="toggle">
    <span>Week starts Monday</span>
    <input id="sWeekStart" type="checkbox">
  </label>
  <div class="actions">
    <button type="button" id="sExport" class="ghost-btn">Export</button>
    <button type="button" id="sImport" class="ghost-btn">Import</button>
    <button type="button" id="sClose" class="primary">Done</button>
  </div>
  <input id="sFile" type="file" accept="application/json" hidden>
</section>

<div id="toast" class="toast" hidden></div>

<script type="module" src="./js/app.js"></script>
</body>
</html>
